name: One-shot ETAP2 implementation plan import

on:
  push:
    paths:
      - .github/workflows/import-architect-source.yml

permissions:
  contents: write

jobs:
  import-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify prepared plan snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            'https://drive.usercontent.google.com/download?id=1pvNoAArX4aEpwCEzltXrWQh3fjZUg03d&export=download&confirm=t' \
            -o /tmp/plan.tar.gz
          printf '%s  %s\n' '17ffc40a978d3cbe8e9fdc8166427c7ae8b32d4cb9bc3061ab053d9d6a9fbd6f' '/tmp/plan.tar.gz' | sha256sum -c -
          tar -xzf /tmp/plan.tar.gz
          test -f 07_IMPLEMENTATION_PLAN/TASK_CATALOG.md
          test -f 07_IMPLEMENTATION_PLAN/task_catalog.csv
          test "$(grep -Ec '^## (FND|P1|P2|P3|P4|X|ACC)-[0-9]{3} — ' 07_IMPLEMENTATION_PLAN/TASK_CATALOG.md)" -eq 37
          test "$(($(wc -l < 07_IMPLEMENTATION_PLAN/task_catalog.csv)-1))" -eq 37

      - name: Persist complete implementation plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WMS Outbound ETAP 2'
          git config user.email 'actions@users.noreply.github.com'
          git add 07_IMPLEMENTATION_PLAN
          if git diff --cached --quiet; then
            echo 'Plan already exact; nothing to commit.'
          else
            git commit -m 'docs(plan): persist complete 37-item implementation catalog'
            git push origin HEAD:main
          fi
